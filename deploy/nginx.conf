# nginx 反代：服务器有公网 IP、想自己管证书时用这套
# 放到 /etc/nginx/conf.d/cyberlog.conf，然后 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name shidagu.online www.shidagu.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name shidagu.online www.shidagu.online;

    ssl_certificate     /etc/letsencrypt/live/shidagu.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shidagu.online/privkey.pem;

    # 视频上传上限 50MB，留出 multipart 余量
    client_max_body_size 60m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Next 静态资源：一年强缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 媒体出口已有 immutable 头，这里不要重复加
    location /api/media/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # 视频转码可能超过默认 60s
    }
}
